# Copy to .github/workflows/ci.yml in the application repository.
# Requires .nvmrc, package-lock.json, and real build/test scripts at the root.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Add merge_group if this check is required by a GitHub merge queue.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      # Add `npm run lint` when the project has a real lint script/configuration.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          CI: "true"
